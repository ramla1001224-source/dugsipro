name: smart_school_pro
description: Smart School Pro - Mobile App for Android & iOS
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP & Networking
  dio: 5.4.0
  
  # Secure Storage for JWT token
  flutter_secure_storage: 9.0.0
  
  # Navigation
  go_router: 13.2.0
  
  # State Management
  provider: 6.1.1
  
  # UI Components
  fl_chart: 0.68.0
  cached_network_image: 3.3.1
  shimmer: 3.0.0
  
  # Utilities
  intl: 0.19.0
  shared_preferences: 2.2.2
  path: 1.9.1
  
  # Icons
  cupertino_icons: 1.0.6
  url_launcher: 6.3.2
  image_picker: 1.0.7
  file_picker: 8.0.0+1
  firebase_core: 3.10.1
  firebase_messaging: 15.2.1
  flutter_local_notifications: 17.1.2
  sqflite: 2.3.3+1
  flutter_app_badger: 1.5.0
  connectivity_plus: 7.1.1
  path_provider: 2.1.5
  google_mobile_ads: 5.1.0
  flutter_screenutil: 5.9.3
  youtube_player_flutter: ^9.1.3



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 3.0.0
  flutter_launcher_icons: 0.14.4
  flutter_native_splash: 2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#0F172A"
  image: "assets/images/app_icon.png"
  android_12:
    image: "assets/images/app_icon.png"
    icon_background_color: "#0F172A"
    color: "#0F172A"
  web: false
