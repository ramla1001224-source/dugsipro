<!DOCTYPE html>
<html lang="so">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — Dugsi Pro System</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      color: #f8fafc;
      padding: 24px;
      text-align: center;
    }

    .glow {
      position: fixed;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      filter: blur(120px);
      pointer-events: none;
    }
    .glow-blue  { top: -200px; right: -200px; background: rgba(37,99,235,.15); }
    .glow-purple{ bottom: -200px; left: -200px; background: rgba(124,58,237,.12); }

    .card {
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 2.5rem;
      padding: 56px 48px;
      max-width: 460px;
      width: 100%;
      backdrop-filter: blur(20px);
      position: relative;
      z-index: 1;
    }

    .icon-wrap {
      width: 96px;
      height: 96px;
      background: rgba(220,38,38,.12);
      border: 1px solid rgba(220,38,38,.2);
      border-radius: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 32px;
      font-size: 44px;
      animation: pulse 2.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50%       { transform: scale(1.06); opacity: .8; }
    }

    h1 {
      font-size: 1.875rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 12px;
    }
    h1 span { color: #3b82f6; }

    p {
      color: #94a3b8;
      font-size: .9375rem;
      line-height: 1.65;
      margin-bottom: 36px;
    }

    .btn {
      display: inline-block;
      background: #2563eb;
      color: #fff;
      font-weight: 700;
      font-size: .875rem;
      letter-spacing: .05em;
      text-transform: uppercase;
      padding: 16px 36px;
      border-radius: 16px;
      border: none;
      cursor: pointer;
      transition: background .2s, transform .15s;
      text-decoration: none;
    }
    .btn:hover  { background: #1d4ed8; }
    .btn:active { transform: scale(.97); }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(220,38,38,.1);
      border: 1px solid rgba(220,38,38,.2);
      color: #f87171;
      font-size: .75rem;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      padding: 6px 16px;
      border-radius: 999px;
      margin-bottom: 24px;
    }
    .badge::before {
      content: '';
      width: 6px; height: 6px;
      background: #ef4444;
      border-radius: 50%;
      animation: blink 1.2s ease-in-out infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
  </style>
</head>
<body>
  <div class="glow glow-blue"></div>
  <div class="glow glow-purple"></div>

  <div class="card">
    <div class="badge">No Internet</div>
    <div class="icon-wrap">📡</div>
    <h1>Waxaad <span>Offline</span> Tahay</h1>
    <p>
      Internet lama helin. Dugsi Pro wuxuu ku sii shaqeynayaa xogta la kaydiyay.
      Marka internet soo noqoto, wax kastoo la beddelayo ayaa si toos ah u sync garaynaysa.
    </p>
    <button class="btn" onclick="window.location.reload()">🔄 Isku Day Dib</button>
  </div>

  <script>
    // Auto-reload when connection is restored
    window.addEventListener('online', () => window.location.reload());
  </script>
</body>
</html>
